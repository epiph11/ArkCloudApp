# Backlog #102 (zéro-coût, "pre-commit secret-scanning") — bloque un commit contenant un secret
# AVANT qu'il n'atteigne git, en complément de Snyk/SonarCloud (déjà en CI, voir
# arkcloud-backend-ci.yml / arkcloud-frontend-ci.yml) : ceux-là ne tournent qu'après le push, donc
# un secret committé par erreur reste dans l'historique git même si le job CI le détecte ensuite.
#
# Installation (une fois, poste local) :
#   pip install pre-commit --break-system-packages   (ou pipx install pre-commit)
#   pre-commit install
# Ensuite, gitleaks tourne automatiquement à chaque `git commit`, sans action manuelle.
#
# Faux positif ? Ajouter une entrée à .gitleaks.toml (allowlist), jamais `git commit --no-verify`
# en réflexe — ce flag existe pour les urgences, pas pour contourner un vrai secret détecté.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
