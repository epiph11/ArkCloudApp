name: DAST — scan dynamique (OWASP ZAP)

# Backlog #102 (zéro-coût, "DAST") — complète le SAST déjà en place (Snyk/SonarCloud sur le code
# source, arkcloud-backend-ci.yml / arkcloud-frontend-ci.yml) par un scan qui tape sur l'app
# RÉELLEMENT déployée en dev (réponses HTTP effectives, en-têtes de sécurité, endpoints exposés) —
# une classe de findings que l'analyse statique ne voit jamais.
#
# workflow_dispatch uniquement, volontairement pas de déclencheur planifié/push : l'environnement
# dev n'est pas garanti disponible (voir dev-env-down.yml, arrêt à la demande) — un cron qui tombe
# pendant que l'environnement est éteint échouerait bruyamment pour rien. À lancer à la main après
# un dev-env-up.yml, ou juste avant de clore une session de test.
#
# Premier passage réel le 13/09/2026 : 0 High sur les deux apps, quelques Medium/Low (en-têtes de
# sécurité manquants — HSTS, CSP, Permissions-Policy, etc.) triés et acceptés comme dette technique
# documentée dans .zap/rules.tsv (chaque ligne = un rule ID ZAP, IGNORE + justification). Gate
# durci en conséquence : continue-on-error retiré, ces deux jobs échouent désormais sur tout NOUVEAU
# type de finding (High ou Medium/Low non listé dans rules.tsv) — pas sur la récurrence des
# instances déjà triées. Pour accepter un nouveau finding : l'ajouter à .zap/rules.tsv avec le même
# format, jamais juste re-ajouter continue-on-error en réflexe.

on:
  workflow_dispatch:

permissions:
  contents: read
  # issues:write déplacé au niveau job (13/09/2026, backlog #111) — SonarCloud a signalé le
  # grant au niveau workflow comme trop large.

jobs:
  zap-api:
    name: ZAP baseline — API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # zaproxy/action-baseline peut ouvrir une issue de suivi si demandé plus tard
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Image officielle OWASP ZAP, gratuite, pas de token/compte nécessaire. Scan "baseline" =
      # spider passif + règles actives non-intrusives (pas de scan actif agressif qui pourrait
      # écrire des données ou déclencher le cost-guard via une charge inhabituelle) — adapté à un
      # environnement dev partagé plutôt qu'un scan "full" réservé à un environnement jetable.
      - name: ZAP baseline scan — API
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "https://app-arkcloud-api-dev.azurewebsites.net"
          # /health n'exerce aucune route applicative réelle (voir Program.cs — pas de check DB) ;
          # le spider ZAP part de la racine et suit les liens qu'il trouve, y compris ceux exposés
          # par Swagger (Swashbuckle.AspNetCore, activé dans ArkCloud.API.csproj) si accessible.
          cmd_options: "-a"
          rules_file_name: ".zap/rules.tsv"
          artifact_name: "zap-report-api"

  zap-web:
    name: ZAP baseline — Blazor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ZAP baseline scan — Blazor
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "https://app-arkcloud-web-dev.azurewebsites.net"
          cmd_options: "-a"
          rules_file_name: ".zap/rules.tsv"
          artifact_name: "zap-report-web"
