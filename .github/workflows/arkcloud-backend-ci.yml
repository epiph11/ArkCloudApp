name: arkcloud-backend-ci

on:
  push:
    branches: [main, staging, develop]
    # v* tags are what actually ship a production release (see publish-image below) —
    # note GitHub does not apply the paths filter to tag pushes, so a version tag always
    # runs this workflow in full regardless of what changed.
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/arkcloud-backend-ci.yml"
  pull_request:
    branches: [main, staging, develop]
    paths:
      - "backend/**"
      - ".github/workflows/arkcloud-backend-ci.yml"

permissions:
  contents: read
  packages: write
  id-token: write # required for the AWS OIDC login step below (publish-image job only)

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/arkcloud-api

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore backend/ArkCloud.API/ArkCloud.API.csproj
          dotnet restore backend/tests/ArkCloud.Tests.Unit/ArkCloud.Tests.Unit.csproj
          dotnet restore backend/tests/ArkCloud.Tests.Integration/ArkCloud.Tests.Integration.csproj

      - name: Build
        run: |
          dotnet build backend/ArkCloud.API/ArkCloud.API.csproj --no-restore --configuration Release
          dotnet build backend/tests/ArkCloud.Tests.Unit/ArkCloud.Tests.Unit.csproj --no-restore --configuration Release
          dotnet build backend/tests/ArkCloud.Tests.Integration/ArkCloud.Tests.Integration.csproj --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test backend/tests/ArkCloud.Tests.Unit/ArkCloud.Tests.Unit.csproj --no-build --configuration Release --logger trx --results-directory ./TestResults
          dotnet test backend/tests/ArkCloud.Tests.Integration/ArkCloud.Tests.Integration.csproj --no-build --configuration Release --logger trx --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults

      - name: Publish API
        run: dotnet publish backend/ArkCloud.API/ArkCloud.API.csproj -c Release -o ./publish

  # Only runs on push (never on PRs), and only after build-test passes.
  #
  # A plain push to `main` does NOT publish an image — main is where staging gets merged
  # once validated, but a production release is a deliberate act: push a `vX.Y.Z` tag (see
  # docs/versioning, or just `git tag vX.Y.Z && git push origin vX.Y.Z` from main once merged).
  # develop and staging pushes still publish work-in-progress images for their own environments.
  publish-image:
    needs: build-test
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'staging' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    # Requires "development", "staging" and "production" Environments configured in
    # Settings > Environments. Add required reviewers on "production" there to get a
    # manual approval gate before any vX.Y.Z tag actually gets pushed to the registry —
    # no workflow change needed to turn that on.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    env:
      # Tag pushes (vX.Y.Z) publish under the version itself; branch pushes publish under
      # a floating tag for that environment.
      ENV_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.ref_name == 'staging' && 'staging' || 'dev' }}
      # Same three-way split, but matching ArkCloudInfra's environments/{dev,staging,prod}
      # folder names exactly (ENV_TAG uses "development"/version-string, not the same values).
      TF_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f deploy/docker/Dockerfile.api -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }} .

      # Scans the image just built, before it ever reaches the registry. exit-code: '1' makes
      # this step (and therefore the job) fail on any CRITICAL/HIGH finding that has a known
      # fix — ignore-unfixed avoids blocking on base-image CVEs nobody can patch yet.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }}

      # A version tag also moves the floating `:prod` tag, so "the current prod image" always
      # has a stable name to reference without needing to know the latest version number.
      - name: Update floating prod tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }} ${{ env.IMAGE_NAME }}:prod
          docker push ${{ env.IMAGE_NAME }}:prod

      # --- AWS / ECR (task #38) ---
      # GHCR above serves Azure (App Service pulls straight from ghcr.io); ECS on AWS can only
      # pull from ECR (or a registry it's explicitly authenticated against), so the same image
      # also needs pushing here — this is what actually lets the ECS services in Sprint 5's
      # aws_ecs_service_api/web modules run something other than an empty task.
      #
      # Guarded to "dev" only: only environments/dev's aws_ecr module exists today (Sprint 5).
      # staging/prod ECR repos land with Sprints 6-10 — drop this `if:` once those exist, the
      # step itself needs no change (ECR_REPOSITORY already derives from TF_ENVIRONMENT).
      - name: Configure AWS credentials
        if: env.TF_ENVIRONMENT == 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_CI_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to ECR
        if: env.TF_ENVIRONMENT == 'dev'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: env.TF_ENVIRONMENT == 'dev'
        env:
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPOSITORY: arkcloud-arkcloud-${{ env.TF_ENVIRONMENT }}/api
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENV_TAG }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENV_TAG }}

      # Notifies ArkCloudInfra that a new API image is ready — deploy-on-image.yml over there
      # picks this up and runs a scoped `terraform apply -target=...` for just this app.
      # INFRA_DISPATCH_TOKEN is a fine-grained PAT with Contents:write on ArkCloudInfra only —
      # GITHUB_TOKEN can't be used here, it's scoped to this repo and can't dispatch to another.
      - name: Notify ArkCloudInfra of new image
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/ArkCloudInfra
          event-type: image-published
          client-payload: >-
            {"app": "api", "tag": "${{ env.ENV_TAG }}", "environment": "${{ env.TF_ENVIRONMENT }}"}
