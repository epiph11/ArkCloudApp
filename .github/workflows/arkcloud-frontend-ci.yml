name: arkcloud-frontend-ci

on:
  push:
    branches: [main, staging, develop]
    # v* tags are what actually ship a production release (see publish-image below) —
    # note GitHub does not apply the paths filter to tag pushes, so a version tag always
    # runs this workflow in full regardless of what changed.
    tags: ["v*"]
    paths:
      - "frontend/**"
      - ".github/workflows/arkcloud-frontend-ci.yml"
  pull_request:
    branches: [main, staging, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/arkcloud-frontend-ci.yml"
  # Manual trigger — not subject to the paths filters above, useful for retesting
  # publish-image (e.g. AWS OIDC/ECR changes) without needing an unrelated file edit.
  workflow_dispatch:

permissions:
  contents: read
  # packages:write / id-token:write moved to publish-image's own permissions: block below
  # (13/09/2026, backlog #111) — SonarCloud flagged the workflow-level grant as too broad;
  # build-test never needs either. Mirrors the same fix in arkcloud-backend-ci.yml.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/arkcloud-frontend
  # No-op until SNYK_TOKEN exists (docs/infra-roadmap.md §18.3) — same pattern as
  # arkcloud-backend-ci.yml. SonarCloud is deliberately not wired here: arkcloud-backend-ci.yml's
  # dotnet-sonarscanner begin/end only wraps that workflow's own Restore/Build/Test steps
  # (backend/** projects), so it does NOT reach frontend/ArkCloud.Blazor despite NDepend's
  # separate, wider `ArkCloud.sln` scan doing so — adding a second SonarCloud project here would
  # need its own key/org and its own begin/end around this workflow's build. Skipped for now:
  # this frontend is Sprint 7's Angular migration target, not worth wiring twice before the
  # rewrite. Revisit if Sprint 7 slips.
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # ArkCloud.Blazor references ArkCloud.Application (shared DTOs) from ../backend,
      # so the full repo checkout above is required even though this workflow is
      # scoped to frontend/** changes.
      - name: Restore
        run: |
          dotnet restore frontend/ArkCloud.Blazor/ArkCloud.Blazor.csproj
          dotnet restore frontend/ArkCloud.Tests.Component/ArkCloud.Tests.Component.csproj

      - name: Snyk (dependencies)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/dotnet@12140f4059e244892ae643824a95459a102120dd # master (13/09/2026)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high frontend/ArkCloud.Blazor/ArkCloud.Blazor.csproj

      - name: Build
        run: |
          dotnet build frontend/ArkCloud.Blazor/ArkCloud.Blazor.csproj --no-restore --configuration Release
          dotnet build frontend/ArkCloud.Tests.Component/ArkCloud.Tests.Component.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test frontend/ArkCloud.Tests.Component/ArkCloud.Tests.Component.csproj --no-build --configuration Release --logger trx --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: ./TestResults

      - name: Publish Blazor app
        run: dotnet publish frontend/ArkCloud.Blazor/ArkCloud.Blazor.csproj -c Release -o ./publish

  # Only runs on push (never on PRs), and only after build-test passes.
  #
  # A plain push to `main` does NOT publish an image — main is where staging gets merged
  # once validated, but a production release is a deliberate act: push a `vX.Y.Z` tag (see
  # docs/versioning, or just `git tag vX.Y.Z && git push origin vX.Y.Z` from main once merged).
  # develop and staging pushes still publish work-in-progress images for their own environments.
  publish-image:
    needs: build-test
    if: >-
      (github.event_name == 'push' &&
       (startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'staging' || github.ref_name == 'develop')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Requires "development", "staging" and "production" Environments configured in
    # Settings > Environments. Add required reviewers on "production" there to get a
    # manual approval gate before any vX.Y.Z tag actually gets pushed to the registry —
    # no workflow change needed to turn that on.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    # Job-level permissions (13/09/2026, backlog #111) — only this job needs packages:write
    # (GHCR push) and id-token:write (AWS OIDC step below).
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Tag pushes (vX.Y.Z) publish under the version itself; branch pushes publish under
      # a floating tag for that environment.
      ENV_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.ref_name == 'staging' && 'staging' || 'dev' }}
      # Same three-way split, but matching ArkCloudInfra's environments/{dev,staging,prod}
      # folder names exactly (ENV_TAG uses "development"/version-string, not the same values).
      TF_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: docker build -f deploy/docker/Dockerfile.blazor -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }} .

      # Scans the image just built, before it ever reaches the registry. exit-code: '1' makes
      # this step (and therefore the job) fail on any CRITICAL/HIGH finding that has a known
      # fix — ignore-unfixed avoids blocking on base-image CVEs nobody can patch yet.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Snyk container scan — complements Trivy, mirrors arkcloud-backend-ci.yml.
      - name: Snyk (container image)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/docker@12140f4059e244892ae643824a95459a102120dd # master (13/09/2026)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          args: --severity-threshold=high --file=deploy/docker/Dockerfile.blazor

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }}

      # A version tag also moves the floating `:prod` tag, so "the current prod image" always
      # has a stable name to reference without needing to know the latest version number.
      - name: Update floating prod tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }} ${{ env.IMAGE_NAME }}:prod
          docker push ${{ env.IMAGE_NAME }}:prod

      # SBOM + signature (Syft/Cosign) — mirrors arkcloud-backend-ci.yml, see comments there.
      - name: Resolve pushed image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:${{ github.sha }} | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom-web.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-web
          path: sbom-web.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (Cosign, keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"

      - name: Attest SBOM (Cosign)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom-web.spdx.json \
            --type spdxjson \
            "${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"

      # --- AWS / ECR (task #38) — mirrors arkcloud-backend-ci.yml, see comments there.
      - name: Configure AWS credentials
        if: env.TF_ENVIRONMENT == 'dev'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_CI_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to ECR
        if: env.TF_ENVIRONMENT == 'dev'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Tag and push image to ECR
        if: env.TF_ENVIRONMENT == 'dev'
        env:
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPOSITORY: arkcloud-arkcloud-${{ env.TF_ENVIRONMENT }}/web
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENV_TAG }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENV_TAG }}

      # Notifies ArkCloudInfra that a new web image is ready — deploy-on-image.yml over there
      # picks this up and runs a scoped `terraform apply -target=...` for just this app.
      # INFRA_DISPATCH_TOKEN is a fine-grained PAT with Contents:write on ArkCloudInfra only —
      # GITHUB_TOKEN can't be used here, it's scoped to this repo and can't dispatch to another.
      - name: Notify ArkCloudInfra of new image
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/ArkCloudInfra
          event-type: image-published
          client-payload: >-
            {"app": "web", "tag": "${{ env.ENV_TAG }}", "environment": "${{ env.TF_ENVIRONMENT }}"}
